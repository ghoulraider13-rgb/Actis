name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.12.0

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Type check
        run: pnpm run lint

  # Windows CI temporarily disabled due to node-gyp 10.2.0 / VS 2022 v18 incompatibility
  # better-sqlite3@13.0.3 uses node-gyp@10.2.0 which doesn't detect VS 2022 (version 18)
  # Re-enable when better-sqlite3 upgrades to node-gyp 11+ or GitHub Actions updates runners
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows CI skipped
        run: echo "Windows CI temporarily disabled - see workflow comments"
        shell: bash
