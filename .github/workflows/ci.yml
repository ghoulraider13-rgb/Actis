name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.12.0

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 20
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if (Test-Path $vsPath) {
            & cmd /c "`"$vsPath`" x64 && pnpm install --frozen-lockfile"
          } else {
            Write-Warning "vcvarsall.bat not found at $vsPath"
            pnpm install --frozen-lockfile
          }

      - name: Install dependencies (macOS/Ubuntu)
        if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Type check
        run: pnpm run lint
